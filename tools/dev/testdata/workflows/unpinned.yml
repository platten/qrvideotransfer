# Violations: a tag, a branch, a short SHA, a missing version comment, a comment that is not a
# version, and an unpinned container.
name: unpinned
on: push
permissions: {}
jobs:
  a:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@main
      - uses: actions/cache@55cc834 # v6.1.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # latest
      - uses: docker://alpine:3
