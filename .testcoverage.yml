# Configuration for vladopajic/go-test-coverage v2, used in CI. The same gate runs offline in
# `go run ./tools/dev cover`; keep the two in step.
profile: coverage.out

threshold:
  file: 0
  package: 95
  total: 0

exclude:
  paths:
    - ^cmd/qrvt/main\.go$
    - ^tools/
    - ^spikes/
    - _gen\.go$ # generated tables
