# Dependency updates (DESIGN.md section 17, SECURITY.md section 8). Dependabot keeps actions pinned
# by commit and updates the version comment with the SHA. Pinned tools in tools/dev/tools.go (with
# their SHA-256 sums) and the Go version are updated by hand.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The video engine's pins are updated by hand only. Every engine speed, memory and sandbox
    # figure of spike S1 (docs/spikes/S1.md) was measured on exactly these versions; they are
    # updated deliberately, with stream D re-running the S1 measurements, no later than M7.
    ignore:
      - dependency-name: github.com/tetratelabs/wazero
      - dependency-name: codeberg.org/gruf/go-ffmpreg
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
